name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate JavaScript Syntax
        run: |
          node --check src/js/config.js
          node --check src/js/modules/parser.js
          node --check src/js/modules/stats.js
          node --check src/js/modules/storage.js
          node --check src/js/modules/toolbar.js
          node --check src/js/modules/scroller.js
          node --check src/js/modules/exporter.js
          node --check src/js/app.js

      - name: Execute Automated Unit Tests
        run: npm test

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t markdown-studio:ci .
